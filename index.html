<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Munkaidő Naptár v12 - Dinamikus Egyenleg</title>
    <style>
        :root { --p: #005691; --bg: #f4f7f9; --text: #333; --ok: #28a745; --less: #dc3545; --more: #fd7e14; --vac: #007bff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 450px; }

        .header { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center; border-top: 5px solid var(--p); }
        .month-sel { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; font-size: 1.1rem; font-weight: bold; color: var(--p); cursor: pointer; margin-bottom: 15px; }
        .stats { display: flex; justify-content: space-around; background: var(--p); color: white; padding: 15px; border-radius: 15px; }
        .stat-val { display: block; font-weight: bold; font-size: 1.1rem; }

        .calendar-grid { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 0.75rem; color: #888; margin-bottom: 10px; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        
        .day { height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; font-weight: bold; border: 1px solid #eee; transition: 0.2s; }
        .day:active { transform: scale(0.9); }
        .day.empty { border: none; cursor: default; }
        .day.selected { border: 2px solid var(--p) !important; box-shadow: 0 0 8px rgba(0,86,145,0.3); }
        
        .status-ok { background: var(--ok) !important; color: white; }
        .status-less { background: var(--less) !important; color: white; }
        .status-more { background: var(--more) !important; color: white; }
        .status-vac { background: var(--vac) !important; color: white; }

        .legend { display: flex; flex-direction: column; gap: 8px; padding: 15px 5px 5px 5px; margin-top: 10px; border-top: 1px solid #eee; font-size: 0.85rem; color: #555; }
        .legend-item { display: flex; align-items: center; gap: 10px; }
        .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

        .editor-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 15px; text-align: center; }
        .date-label { font-size: 1.2rem; font-weight: 800; color: var(--p); margin-bottom: 15px; display: block; }
        .inputs { display: flex; justify-content: center; gap: 15px; align-items: center; }
        input[type="time"] { padding: 10px; border-radius: 10px; border: 2px solid #ddd; font-size: 1rem; font-family: inherit; }
        
        .daily-res { margin-top: 15px; font-size: 1.3rem; font-weight: bold; color: var(--p); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-save { background: var(--p); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-vac { background: var(--vac); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <select id="mSel" class="month-sel" onchange="renderCalendar()"></select>
        <div class="stats">
            <div><small>Havi munka</small><span id="tWork" class="stat-val">0ó 0p</span></div>
            <div><small id="balLabel">Egyenleg (eddig)</small><span id="tBal" class="stat-val">0ó 0p</span></div>
        </div>
    </div>

    <div class="calendar-grid">
        <div class="weekdays">
            <div>H</div><div>K</div><div>SZ</div><div>CS</div><div>P</div><div>SZ</div><div>V</div>
        </div>
        <div id="daysGrid" class="days"></div>
        
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:var(--less)"></span> Kevesebb mint 8 óra</div>
            <div class="legend-item"><span class="dot" style="background:var(--ok)"></span> Pontosan 8 óra</div>
            <div class="legend-item"><span class="dot" style="background:var(--more)"></span> Több mint 8 óra</div>
            <div class="legend-item"><span class="dot" style="background:var(--vac)"></span> Szabadság</div>
        </div>
    </div>

    <div class="editor-card">
        <span id="selectedDateText" class="date-label">-</span>
        <div class="inputs">
            <input type="time" id="sTime" onfocus="handleFocus('sTime', '05:50')" oninput="updateCurrent()">
            <span>-</span>
            <input type="time" id="eTime" onfocus="handleFocus('eTime', '14:20')" oninput="updateCurrent()">
        </div>
        <div id="dNet" class="daily-res">0ó 0p</div>
        <div class="btn-group">
            <button class="btn-vac" onclick="setVacation()">SZABADSÁG</button>
            <button class="btn-save" onclick="saveData()">MENTÉS</button>
        </div>
    </div>
</div>

<script>
    let currentDay = new Date().getDate();
    const months = ["Január","Február","Március","Április","Május","Június","Július","Augusztus","Szeptember","Október","November","December"];
    const year = 2026;

    const mSel = document.getElementById('mSel');
    months.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = i; opt.text = m;
        if(i === new Date().getMonth()) opt.selected = true;
        mSel.appendChild(opt);
    });

    function renderCalendar() {
        const m = parseInt(mSel.value);
        const daysGrid = document.getElementById('daysGrid');
        daysGrid.innerHTML = '';

        const firstDay = new Date(year, m, 1).getDay();
        const shift = firstDay === 0 ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        const saved = JSON.parse(localStorage.getItem(`work_v10_${m}`)) || {};

        for (let i = 0; i < shift; i++) {
            const div = document.createElement('div');
            div.className = 'day empty';
            daysGrid.appendChild(div);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const div = document.createElement('div');
            div.className = 'day';
            div.id = `day-${i}`;
            div.innerText = i;
            div.onclick = () => selectDay(i);

            const data = saved[i];
            if (data && data.s && data.e) {
                if (data.isVac) {
                    div.classList.add('status-vac');
                } else {
                    const netto = calcNetto(data.s, data.e);
                    if (netto === 480) div.classList.add('status-ok');
                    else if (netto < 480) div.classList.add('status-less');
                    else div.classList.add('status-more');
                }
            }

            if (i === currentDay) div.classList.add('selected');
            daysGrid.appendChild(div);
        }
        loadDayData();
        calculateTotals();
    }

    function selectDay(d) {
        currentDay = d;
        document.querySelectorAll('.day').forEach(el => el.classList.remove('selected'));
        const el = document.getElementById(`day-${d}`);
        if(el) el.classList.add('selected');
        loadDayData();
        calculateTotals(); // Frissítjük a statisztikát a kiválasztott napra!
    }

    function loadDayData() {
        const m = mSel.value;
        const saved = JSON.parse(localStorage.getItem(`work_v10_${m}`)) || {};
        const data = saved[currentDay] || {s:'', e:'', isVac: false};
        document.getElementById('sTime').value = data.s;
        document.getElementById('eTime').value = data.e;
        document.getElementById('selectedDateText').innerText = `${months[m]} ${currentDay}.`;
        updateCurrent();
    }

    function calcNetto(s, e) {
        if(!s || !e) return 0;
        const [h1, m1] = s.split(':').map(Number);
        const [h2, m2] = e.split(':').map(Number);
        let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (diff < 0) diff += 1440;
        return Math.max(0, diff - 30);
    }

    function updateCurrent() {
        const s = document.getElementById('sTime').value;
        const e = document.getElementById('eTime').value;
        const disp = document.getElementById('dNet');
        if (s && e) {
            const netto = calcNetto(s, e);
            disp.innerText = `${Math.floor(netto/60)}ó ${netto%60}p`;
        } else disp.innerText = "0ó 0p";
    }

    function setVacation() {
        document.getElementById('sTime').value = "05:50";
        document.getElementById('eTime').value = "14:20";
        updateCurrent();
        saveData(true);
    }

    function saveData(isVac = false) {
        const m = mSel.value;
        const saved = JSON.parse(localStorage.getItem(`work_v10_${m}`)) || {};
        saved[currentDay] = { 
            s: document.getElementById('sTime').value, 
            e: document.getElementById('eTime').value,
            isVac: isVac
        };
        localStorage.setItem(`work_v10_${m}`, JSON.stringify(saved));
        renderCalendar();
    }

    function calculateTotals() {
        const currentM = parseInt(mSel.value);
        let cumulativeBalance = 0;
        let monthlyWork = 0;

        // Végigmegyünk az év hónapjain
        for (let m = 0; m <= currentM; m++) {
            const saved = JSON.parse(localStorage.getItem(`work_v10_${m}`)) || {};
            // Rendezett napok szerinti feldolgozás
            const days = Object.keys(saved).map(Number).sort((a, b) => a - b);
            
            for (let d of days) {
                // Ha az aktuális hónapban járunk, csak a kiválasztott NAP-ig számolunk bele az egyenlegbe
                if (m === currentM && d > currentDay) continue;

                if (saved[d].s && saved[d].e) {
                    const netto = calcNetto(saved[d].s, saved[d].e);
                    cumulativeBalance += (netto - 480);
                    
                    // A "Havi munka" továbbra is a teljes hónapot mutassa (vagy ha zavaró, ezt is korlátozhatjuk)
                    if (m === currentM) {
                        monthlyWork += netto;
                    }
                }
            }
        }

        document.getElementById('tWork').innerText = `${Math.floor(monthlyWork/60)}ó ${monthlyWork%60}p`;
        const bEl = document.getElementById('tBal');
        bEl.innerText = (cumulativeBalance < 0 ? '-' : '+') + `${Math.floor(Math.abs(cumulativeBalance)/60)}ó ${Math.abs(cumulativeBalance)%60}p`;
        bEl.style.color = cumulativeBalance < 0 ? '#ffb3b3' : '#b3ffcc';
        
        // Frissítjük a címkét, hogy egyértelmű legyen mire vonatkozik az egyenleg
        document.getElementById('balLabel').innerText = `Egyenleg (${months[currentM]} ${currentDay}-ig)`;
    }

    function handleFocus(id, def) {
        const el = document.getElementById(id);
        if (!el.value) { el.value = def; updateCurrent(); }
    }

    renderCalendar();
</script>
</body>
</html>
